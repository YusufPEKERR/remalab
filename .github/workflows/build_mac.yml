name: Build macOS App Bundle

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mac/requirements.txt pyinstaller

      - name: Build macOS App
        run: |
          cd mac
          chmod +x build_mac_app.sh
          ./build_mac_app.sh

      - name: Archive .app bundle using Apple ditto
        run: |
          cd mac/dist
          ditto -c -k --sequesterRsrc --keepParent "ERP Web App.app" "../../ERP_Web_App_macOS.zip"

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Web-App-macOS
          path: ERP_Web_App_macOS.zip
          retention-days: 30
