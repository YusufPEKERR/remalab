name: Build macOS App Bundle

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel Mac'ler (örn. A1708 MacBook Pro) için native x86_64 runner
          - runner: macos-13
            arch: x86_64
          # Apple Silicon Mac'ler için native arm64 runner
          - runner: macos-14
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mac/requirements.txt pyinstaller

      - name: Build macOS App
        run: |
          cd mac
          chmod +x build_mac_app.sh
          ./build_mac_app.sh

      - name: Archive .app bundle using Apple ditto
        run: |
          cd mac/dist
          ditto -c -k --sequesterRsrc --keepParent "ERPWebApp.app" "../../ERP_Web_App_macOS_${{ matrix.arch }}.zip"

      - name: Upload macOS App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ERP-Web-App-macOS-${{ matrix.arch }}
          path: ERP_Web_App_macOS_${{ matrix.arch }}.zip
          retention-days: 30
